<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>我的网页游戏合集</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 16px;
    }
    .container {
      width: 100%;
      max-width: 760px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      font-weight: 700;
    }
    .subtitle {
      margin: 0 0 28px;
      color: #94a3b8;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 18px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #38bdf8;
      background: rgba(255, 255, 255, 0.1);
    }
    .badge {
      display: inline-block;
      align-self: flex-start;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(74, 222, 128, 0.18);
      color: #4ade80;
    }
    .card h2 {
      margin: 0;
      font-size: 18px;
    }
    .card p {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
      color: #cbd5e1;
    }
    .play-btn {
      margin-top: auto;
      padding: 9px 14px;
      border-radius: 8px;
      background: #22c55e;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>我的网页游戏合集</h1>
    <p class="subtitle">支持 Mac、iPhone 与安卓手机浏览器直接打开游玩</p>
    <div class="grid">
      <a class="card" href="./minecraft/">
        <span class="badge">3D 沙盒 · 跨端支持</span>
        <h2>我的世界 网页版</h2>
        <p>纯 WebGL 3D 体素沙盒，支持地形探索、游泳上岸、方块建造与本地自动存档。</p>
        <div class="play-btn">立即开始</div>
      </a>
    </div>
  </div>
</body>
</html>
